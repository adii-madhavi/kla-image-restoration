# Lightweight restoration candidate for the model-size / throughput
# Pareto comparison (Architecture.md §8, final step). Same architecture
# family as restoration_candidate.yaml but with reduced capacity, to be
# compared for the accuracy/runtime trade-off described in
# Architecture.md "Capacity strategy".

seed: 2026
device: auto
precision: amp
validate_every: 1
checkpoint_every: 5

data:
  degraded_dir: data/train/degraded
  gt_dir: data/train/gt
  split_path: splits/split_seed_2026.json
  val_fraction: 0.1
  num_workers: 4
  preprocess:
    clip_input: false
    clip_min: -1.0
    clip_max: 2.0

model:
  name: restoration_candidate
  input_channels: 1
  scale: 2
  n_features: 32
  n_groups: 2
  n_blocks_per_group: 4
  reduction: 8
  res_scale: 0.2
  use_frequency_branch: false
  clip_output: true

loss:
  pixel_loss: charbonnier
  w_pixel: 1.0
  w_struct: 0.1
  w_grad: 0.05

optimizer:
  lr: 2.0e-4
  weight_decay: 0.0
  batch_size: 24
  val_batch_size: 24
  epochs: 100
  scheduler: cosine
  grad_clip: 1.0

augmentation:
  geometric: true
  synthetic_degradation: true
  synthetic_prob: 0.3
  synthetic_degradation_kwargs:
    gaussian_sigma_range: [0.01, 0.08]
    speckle_sigma_range: [0.02, 0.15]
    downsample_factor_range: [1.5, 4.0]

inference:
  batch_size: 32
